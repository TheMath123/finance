name: Deploy dashboard (Cloudflare)

on:
  push:
    tags:
      - 'dashboard-web-v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      # Env pública (sem segredo, só identifica a origem no Google Cloud
      # Console) — mas `$env/static/public` é resolvida em tempo de build, e
      # se a chave nem existir no ambiente o SvelteKit não gera o export,
      # quebrando o typecheck/build do dashboard (ver
      # google-sign-in-button.svelte / google-link-button.svelte). Repo
      # variable (Settings → Secrets and variables → Actions → Variables),
      # não secret.
      PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
      # Mesmo motivo/mecanismo do PUBLIC_GOOGLE_CLIENT_ID acima (env pública
      # resolvida em tempo de build) — ver +layout.svelte.
      PUBLIC_CLARITY_PROJECT_ID: ${{ vars.PUBLIC_CLARITY_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck do dashboard
        run: bun run typecheck --filter=@finance/dashboard

      - name: Lint do dashboard
        # `--cwd DIR` (espaço) quebra o parser do `run script` — vira só
        # `bun run` sem argumento, imprime o help e sai com 0 (nunca lintava
        # de verdade). `--cwd=DIR` (igual) funciona. Ver comentário
        # equivalente em deploy-backend.yml.
        run: bun --cwd=apps/dashboard run lint

      - name: Build do dashboard
        run: bun run build --filter=@finance/dashboard

      - name: Deploy no Cloudflare Workers
        # bunx direto em vez de cloudflare/wrangler-action@v3 — a action tenta
        # instalar o wrangler sozinha via npm quando não encontra um binário
        # local (não é o caso, mas o instalador dela quebra mesmo assim nos
        # runners com Node 24 default). Como wrangler já é devDependency do
        # projeto (bun install acima), só falta rodar.
        working-directory: apps/dashboard
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
