name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://finance:finance@localhost:5432/finance
      # Env pública (sem segredo, só identifica a origem no Google Cloud
      # Console) — mas `$env/static/public` é resolvida em tempo de build, e
      # se a chave nem existir no ambiente o SvelteKit não gera o export,
      # quebrando o typecheck/build do dashboard (ver
      # google-sign-in-button.svelte / google-link-button.svelte). Repo
      # variable (Settings → Secrets and variables → Actions → Variables),
      # não secret.
      PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
      # Mesmo motivo/mecanismo do PUBLIC_GOOGLE_CLIENT_ID acima (env pública
      # resolvida em tempo de build) — ver +layout.svelte.
      PUBLIC_CLARITY_PROJECT_ID: ${{ vars.PUBLIC_CLARITY_PROJECT_ID }}
      # Mesmo motivo/mecanismo acima, mas pro app novo apps/landing — ver
      # [lang=lang]/+layout.svelte (botão "Entrar" + CTAs).
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      # Mesmo motivo/mecanismo acima — URL do site institucional, usada só
      # pra linkar Privacidade/Termos a partir do dashboard (banner de
      # cookies, checkbox de cadastro). Ver cookie-consent-banner.svelte e
      # routes/register/+page.svelte.
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      # Mesmo motivo/mecanismo acima — meta de verificação do Google Search
      # Console (revisão da tela de consentimento OAuth). Ver
      # [lang=lang]/+layout.svelte.
      PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck (turbo)
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint

      - name: Lint do landing
        # Biome acima não cobre Svelte de verdade — precisa do prettier+eslint
        # próprio do app (mesmo padrão do dashboard, que só roda esse lint em
        # deploy-dashboard.yml).
        run: bun --cwd=apps/landing run lint

      - name: Migrações
        # `--cwd DIR` (espaço) quebra o parser do `run script` — vira só
        # `bun run` sem argumento, imprime o help e sai com 0. `--cwd=DIR`
        # (igual) funciona. Ver comentário equivalente em
        # deploy-backend.yml.
        run: bun --cwd=packages/db run migrate

      - name: Testes
        run: bun --cwd apps/backend test

      - name: Build do dashboard (smoke test do adapter)
        run: bun run build --filter=@finance/dashboard

      - name: Build do landing (smoke test do adapter)
        run: bun run build --filter=@finance/landing
