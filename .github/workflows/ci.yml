name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://finance:finance@localhost:5432/finance

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck (turbo)
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint

      - name: Migrações
        run: bun --cwd packages/db run migrate

      - name: Testes
        run: bun --cwd apps/backend test

      - name: Build do dashboard (smoke test do adapter)
        run: bun run build --filter=@finance/dashboard
