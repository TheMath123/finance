# Precisa bater com o app criado via `fly apps create marcelus-app` (ver
# runbook em tasks/in-progress/ci-cd-deploy.md). O dockerfile abaixo é
# relativo à RAIZ do repo, não a esta pasta — por isso o deploy precisa
# rodar com `flyctl deploy . --config apps/backend/fly.toml` (o `.`
# explícito é obrigatório: sem ele, o flyctl usa o diretório deste arquivo
# como contexto de build, não o cwd, e duplica o caminho do dockerfile).
app = "marcelus-app"
primary_region = "gru"

[build]
  dockerfile = "apps/backend/Dockerfile"

# Dois processos rodando a mesma imagem: `web` serve HTTP, `worker` consome a
# fila BullMQ (packages/queues) — nenhum dos dois roda sozinho em produção.
[processes]
  web = "bun run apps/backend/src/main/index.ts"
  worker = "bun run apps/backend/src/main/worker.ts"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  processes = ["web"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  processes = ["worker"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
