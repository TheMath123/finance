# Precisa bater com o app criado via `fly apps create marcelus-app` (ver
# runbook em tasks/in-progress/ci-cd-deploy.md).
#
# Duas regras de resolução de caminho DIFERENTES entram em jogo aqui (fonte:
# fly.io/docs/launch/monorepo e community.fly.io/t/dockerfile-path-and-
# relative-files-during-container-build/4788):
# - O CONTEXTO de build (o que os `COPY` do Dockerfile enxergam) é relativo
#   ao diretório de trabalho passado pro `flyctl deploy` — por isso o deploy
#   roda com `flyctl deploy . --config apps/backend/fly.toml` a partir da
#   raiz do repo: o Dockerfile precisa ver `packages/*` via workspace.
# - Já o campo `dockerfile` ABAIXO é relativo à pasta ONDE ESTE ARQUIVO
#   fly.toml está (apps/backend/), não ao diretório de trabalho do comando.
#   Como o Dockerfile mora na mesma pasta deste fly.toml, o valor é só
#   "Dockerfile" — colocar "apps/backend/Dockerfile" aqui duplicava o
#   prefixo (apps/backend/apps/backend/Dockerfile).
app = "marcelus-app"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

# Dois processos rodando a mesma imagem: `web` serve HTTP, `worker` consome a
# fila BullMQ (packages/queues) — nenhum dos dois roda sozinho em produção.
[processes]
  web = "bun run apps/backend/src/main/index.ts"
  worker = "bun run apps/backend/src/main/worker.ts"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  processes = ["web"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  processes = ["worker"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
