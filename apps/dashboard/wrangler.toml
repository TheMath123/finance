# Config do Cloudflare Worker do dashboard (SvelteKit via @sveltejs/adapter-cloudflare).
# `name` precisa bater com o Worker criado no painel/CLI do Cloudflare (ver
# runbook em tasks/in-progress/ci-cd-deploy.md).
name = "marcelus-dashboard"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-01"
# nodejs_compat é o que faz `$env/dynamic/private` (usado em src/lib/server/env.ts)
# funcionar no runtime do Workers — sem isso a env não é lida.
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# Observability (Cloudflare Workers Logs) — logs de produção direto no
# painel Cloudflare (Workers & Pages → marcelus-dashboard → Logs). Traces
# desligado (não usamos instrumentação distribuída ainda).
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# `API_URL` (endereço do backend no Fly.io) DELIBERADAMENTE não entra em
# `[vars]` aqui — isso ficaria em texto plano no repositório. É um
# Cloudflare **secret** (`wrangler secret put API_URL --name
# marcelus-dashboard`), configurado uma vez direto na conta Cloudflare, fora
# do git. Ver runbook em tasks/in-progress/ci-cd-deploy.md pro valor real e
# o passo a passo — o mesmo mecanismo `$env/dynamic/private` (nodejs_compat
# acima) lê secret e var comum de forma idêntica em runtime, então nada
# muda no código.
