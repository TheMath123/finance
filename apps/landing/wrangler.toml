# Config do Cloudflare Worker do site institucional (SvelteKit via
# @sveltejs/adapter-cloudflare). `name` precisa bater com o Worker criado no
# painel/CLI do Cloudflare (ver runbook em tasks/in-progress/ci-cd-deploy.md).
name = "marcelus-site"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-01"
# nodejs_compat é o que faz `$env/dynamic/private` (usado em src/lib/server/env.ts)
# funcionar no runtime do Workers — sem isso a env não é lida.
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[vars]
# URL interna do backend no Fly.io — não é segredo, só o endereço da API
# (a página de Planos busca os dados no servidor, nunca no client).
API_URL = "https://marcelus-app.example.dev"
# URL pública do dashboard — pra onde apontam o botão "Entrar" e as CTAs de
# "Criar conta"/"Assinar". Trocar pelo domínio real (dash.example.com) quando
# o domínio existir (ver runbook).
PUBLIC_APP_URL = "https://dash.example.com"
